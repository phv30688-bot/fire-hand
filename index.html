<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fire Hand - Đốm lửa theo tay</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#0b0a0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fire Hand" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    font-family: Segoe UI, Arial, sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  video {
    display: none;
  }
  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    color: #eee;
    background: rgba(0,0,0,0.45);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    z-index: 10;
    max-width: 320px;
  }
  #hud b { color: #ffcf6b; }
  #status {
    position: absolute;
    bottom: 14px;
    left: 14px;
    color: #9f9;
    background: rgba(0,0,0,0.45);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 10;
  }
  #err {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    background: rgba(120,0,0,0.85);
    padding: 20px 26px;
    border-radius: 12px;
    font-size: 15px;
    max-width: 520px;
    display: none;
    z-index: 20;
  }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="hud">
      🔥 <b>Fire Hand</b><br>
      Xòe bàn tay ra trước webcam để tạo đốm lửa.<br>
      Di chuyển tay → lửa di chuyển theo.<br>
      Đưa tay gần/xa webcam → lửa to/nhỏ.<br>
      Nắm tay lại → lửa biến mất.
    </div>
    <div id="status">Đang khởi động camera...</div>
    <div id="err"></div>
  </div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');

function showError(msg) {
  errEl.style.display = 'block';
  errEl.innerHTML = msg;
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let handLandmarker = null;
let handPresent = false;

async function init() {
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });
  } catch (e) {
    console.error(e);
    showError("Không tải được model nhận diện tay (cần kết nối Internet lần đầu để tải model MediaPipe).<br><br>Chi tiết: " + e.message);
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: "user" },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = "Camera OK. Đang chờ bàn tay...";
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    showError("Không truy cập được webcam. Hãy cho phép quyền camera cho trang này và tải lại.<br><br>Chi tiết: " + e.message);
  }
}

// ---------- Hand geometry helpers ----------
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z||0) - (b.z||0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

// Returns {openRatio 0..1, extendedCount, palmLenNorm, center{x,y} normalized}
function analyzeHand(lm) {
  const wrist = lm[0];
  const fingers = [
    { tip: lm[8],  mcp: lm[5]  }, // index
    { tip: lm[12], mcp: lm[9]  }, // middle
    { tip: lm[16], mcp: lm[13] }, // ring
    { tip: lm[20], mcp: lm[17] }, // pinky
  ];
  let extended = 0;
  for (const f of fingers) {
    const dTip = dist(f.tip, wrist);
    const dMcp = dist(f.mcp, wrist);
    if (dTip > dMcp * 1.25) extended++;
  }
  // thumb: compare tip(4) to mcp(2) relative to wrist, looser threshold
  const thumbTipD = dist(lm[4], wrist);
  const thumbMcpD = dist(lm[2], wrist);
  const thumbExtended = thumbTipD > thumbMcpD * 1.1;

  const palmLenNorm = dist(lm[0], lm[9]); // wrist to middle mcp, normalized coords
  const center = lm[9]; // middle finger mcp ~ palm center-ish, stable point

  return {
    extendedCount: extended + (thumbExtended ? 0.5 : 0),
    palmLenNorm,
    center
  };
}

// ---------- Hand-state hysteresis ----------
let isOpen = false;

// ---------- Particle system ----------
class Particle {
  constructor(x, y, baseHue, radius) {
    const ang = Math.random() * Math.PI * 2;
    const spread = Math.random() * radius * 0.5;
    this.x = x + Math.cos(ang) * spread;
    this.y = y + Math.sin(ang) * spread * 0.6;
    this.vx = (Math.random() - 0.5) * 1.6;
    this.vy = -1.2 - Math.random() * 2.2;
    this.size = radius * (0.18 + Math.random() * 0.28);
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.035;
    this.hue = baseHue + (Math.random() - 0.5) * 40;
    this.swirl = (Math.random() - 0.5) * 0.08;
  }
  update(fastDecay) {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.01; // slight accel upward, like heat rising
    this.vx += this.swirl;
    this.life -= this.decay * (fastDecay ? 4.5 : 1);
    this.size *= 0.985;
    return this.life > 0 && this.size > 0.5;
  }
  draw(ctx) {
    const alpha = Math.max(0, this.life);
    const r = Math.max(0.5, this.size);
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    const l1 = 92, l2 = 60, l3 = 35;
    g.addColorStop(0,   `hsla(${this.hue + 25}, 95%, ${l1}%, ${alpha})`);
    g.addColorStop(0.4, `hsla(${this.hue}, 100%, ${l2}%, ${alpha * 0.9})`);
    g.addColorStop(1,   `hsla(${this.hue - 15}, 100%, ${l3}%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];

function spawnFire(x, y, radius, hue, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, hue, radius));
  }
}

// ---------- Main loop ----------
let lastVideoTime = -1;

function loop() {
  requestAnimationFrame(loop);

  if (video.readyState < 2) return;

  // draw mirrored video as backdrop
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  // slight darken overlay so fire glow pops
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let anchor = null;
  let radiusPx = 0;

  if (handLandmarker && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = handLandmarker.detectForVideo(video, performance.now());

    if (result.landmarks && result.landmarks.length > 0) {
      handPresent = true;
      const lm = result.landmarks[0];
      const info = analyzeHand(lm);

      // hysteresis: need >=3.5 extended to call it open, <=1.5 to call it closed
      if (info.extendedCount >= 3.5) isOpen = true;
      else if (info.extendedCount <= 1.5) isOpen = false;

      const screenX = canvas.width * (1 - info.center.x);
      const screenY = canvas.height * info.center.y;
      anchor = { x: screenX, y: screenY };
      radiusPx = info.palmLenNorm * canvas.width * 0.55;

      statusEl.textContent = isOpen
        ? "Bàn tay: MỞ 🔥"
        : "Bàn tay: NẮM (đóng)";
    } else {
      handPresent = false;
      isOpen = false;
      statusEl.textContent = "Không thấy bàn tay...";
    }
  }

  const hue = (performance.now() / 18) % 360;

  if (anchor && isOpen) {
    spawnFire(anchor.x, anchor.y - radiusPx * 0.3, radiusPx, hue, 3);
  }

  ctx.globalCompositeOperation = 'lighter';
  const fast = !(anchor && isOpen);
  particles = particles.filter(p => {
    const alive = p.update(fast);
    if (alive) p.draw(ctx);
    return alive;
  });
  ctx.globalCompositeOperation = 'source-over';
}

init();
</script>
</body>
</html>
